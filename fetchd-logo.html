<!-- Fetch'd logo mark — paw print + wordmark. Self-contained, drop anywhere. -->
<style>
  .fetchd-logo{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:"Caprasimo",serif;}
  .fetchd-logo__mark{width:78px;height:78px;}
  .fetchd-logo__word{font-size:32px;color:#201e1d;line-height:1;}
  .fetchd-logo--row{flex-direction:row;gap:12px;}
  .fetchd-logo--row .fetchd-logo__mark{width:40px;height:40px;}
  .fetchd-logo--row .fetchd-logo__word{font-size:22px;}
</style>

<!-- Stacked (landing / hero use) -->
<div class="fetchd-logo">
  <svg class="fetchd-logo__mark" viewBox="0 0 78 78" fill="#c67139" stroke="none">
    <ellipse cx="39" cy="52" rx="21" ry="17.5"></ellipse>
    <ellipse cx="14.5" cy="30" rx="9.5" ry="12" transform="rotate(-20 14.5 30)"></ellipse>
    <ellipse cx="31" cy="17" rx="9" ry="11.5" transform="rotate(-6 31 17)"></ellipse>
    <ellipse cx="49" cy="17" rx="9" ry="11.5" transform="rotate(6 49 17)"></ellipse>
    <ellipse cx="65" cy="30" rx="9.5" ry="12" transform="rotate(20 65 30)"></ellipse>
  </svg>
  <div class="fetchd-logo__word">Fetch'd</div>
</div>

<!-- Inline / sidebar use -->
<div class="fetchd-logo fetchd-logo--row">
  <svg class="fetchd-logo__mark" viewBox="0 0 78 78" fill="#c67139" stroke="none">
    <ellipse cx="39" cy="52" rx="21" ry="17.5"></ellipse>
    <ellipse cx="14.5" cy="30" rx="9.5" ry="12" transform="rotate(-20 14.5 30)"></ellipse>
    <ellipse cx="31" cy="17" rx="9" ry="11.5" transform="rotate(-6 31 17)"></ellipse>
    <ellipse cx="49" cy="17" rx="9" ry="11.5" transform="rotate(6 49 17)"></ellipse>
    <ellipse cx="65" cy="30" rx="9.5" ry="12" transform="rotate(20 65 30)"></ellipse>
  </svg>
  <div class="fetchd-logo__word">Fetch'd</div>
</div>
